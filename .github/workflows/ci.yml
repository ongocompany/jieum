name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public SDK packages
        run: pnpm build

      - name: Test public packages
        run: |
          pnpm --filter @jieum/core test
          pnpm --filter @jieum/browser test
          pnpm --filter @jieum/engine-server test
          pnpm --filter @jieum/editor test
          pnpm --filter @jieum/dict-builder test
