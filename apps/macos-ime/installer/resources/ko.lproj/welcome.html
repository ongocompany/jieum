<h1>지음을 설치합니다</h1>
<p>지음은 한글을 입력하는 동안 단어 단위로 한자 후보를 보여 주는 macOS 입력기입니다.</p>
<p>설치 프로그램이 지음을 이 Mac에 설치하고 입력 소스 목록에 추가합니다. 설치 도중 이 Mac의 관리자 암호를 한 번 물어봅니다.</p>
<p>이 버전은 @@MAC_REQUIREMENT@@을 지원합니다.</p>
