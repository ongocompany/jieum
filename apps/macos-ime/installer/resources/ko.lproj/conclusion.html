<h1>설치가 끝났습니다</h1>
<p>화면 오른쪽 위 메뉴 막대의 입력 소스 메뉴에서 <b>지음</b>을 선택하고 한글을 입력해 보세요. 목록에 지음이 없으면 시스템 설정의 <b>키보드 → 텍스트 입력 → 편집</b>에서 추가할 수 있습니다.</p>
<p>후보가 보이면 숫자 키 <b>1~9</b> 또는 화살표 키로 고른 뒤 <b>Enter</b>를 누릅니다.</p>
