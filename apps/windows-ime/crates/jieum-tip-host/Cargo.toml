[package]
name = "jieum-tip-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "지음 후보 창 프로세스 — 입력기 DLL 밖에서 후보를 그린다"

[[bin]]
name = "jieum-tip-host"
path = "src/main.rs"

[dependencies]
jieum-candidates = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # 입력기에게서 명령을 받는 공유 메모리 (`window.rs`)
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
