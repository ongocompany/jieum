<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지음 데모 — 한자입력기</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
        background: #f8f9fa;
        color: #1a1a1a;
        line-height: 1.6;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .hero {
        margin-bottom: 32px;
      }

      .hero h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .hero p {
        color: #666;
        font-size: 14px;
      }

      .meta {
        margin-top: 12px;
        padding: 8px 12px;
        background: #e8f4e8;
        border-radius: 6px;
        font-size: 12px;
        color: #2d7a2d;
        font-family: monospace;
      }

      .card {
        background: white;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .card h2 {
        font-size: 14px;
        font-weight: 600;
        color: #888;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .field {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
      }

      .field:focus {
        border-color: #4a90d9;
        box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.1);
      }

      .area {
        min-height: 120px;
        resize: vertical;
      }

      .editable {
        min-height: 120px;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
      }

      .editable:focus {
        border-color: #4a90d9;
        box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.1);
      }

      .editable:empty::before {
        content: attr(data-placeholder);
        color: #bbb;
        pointer-events: none;
      }

      .log {
        padding: 12px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 8px;
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 60px;
      }

      .help {
        margin-top: 24px;
        padding: 16px;
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 8px;
        font-size: 13px;
        color: #6d5500;
      }

      .help kbd {
        display: inline-block;
        padding: 2px 6px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-family: monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>지음 — 한자입력기 데모</h1>
        <p>한글을 입력하면 실시간으로 한자 후보가 표시됩니다.</p>
        <div class="meta" id="status">사전 로딩 중...</div>
      </section>

      <div class="help">
        <strong>사용법:</strong>
        <kbd>1</kbd>~<kbd>9</kbd> 후보 선택 &middot;
        <kbd>Tab</kbd> 1번 확정 &middot;
        <kbd>↓</kbd> 펼치기 &middot;
        <kbd>↑</kbd> 접기 &middot;
        <kbd>←</kbd><kbd>→</kbd> 이동 &middot;
        <kbd>Enter</kbd> 확정 &middot;
        <kbd>Esc</kbd> 취소
      </div>

      <section style="margin-top: 20px">
        <article class="card">
          <h2>Input</h2>
          <input id="demo-input" class="field" type="text" placeholder="예: 경제 발전 원자력 발전소" />
        </article>

        <article class="card">
          <h2>Textarea</h2>
          <textarea id="demo-textarea" class="field area" placeholder="여기에 문장을 입력해보세요."></textarea>
        </article>

        <article class="card">
          <h2>ContentEditable</h2>
          <div
            id="demo-editable"
            class="editable"
            contenteditable="true"
            spellcheck="false"
            data-placeholder="contenteditable 영역입니다."
          ></div>
        </article>

        <article class="card">
          <h2>변환 로그</h2>
          <pre class="log" id="commit-log">아직 변환된 항목이 없습니다.</pre>
        </article>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
